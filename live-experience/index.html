<!DOCTYPE html>

<body class="live-page">
  <main class="live-shell">
    <header class="live-header">
      <p class="live-brand">LEVEL XVIII <span aria-hidden="true">//</span> REINALDO 18</p>
      <div class="live-monogram" aria-hidden="true">18</div>

      <p class="live-intro">Uma noite especial. Memórias para guardar.</p>

      <p class="cloud-gallery-status" data-gallery-status role="status">Carregando a galeria…</p>
      <div class="cloud-gallery-actions">
        <a class="btn btn-outline" data-gallery-link target="_blank" rel="noopener noreferrer" hidden>ABRIR GALERIA EM OUTRA ABA</a>
        <button class="btn btn-outline" data-gallery-retry type="button" hidden>TENTAR NOVAMENTE</button>

      <noscript><p>Ative o JavaScript para abrir a galeria.</p></noscript>

    <footer class="live-footer">
      <p class="live-event">
        <time datetime="2026-11-28T20:00:00-03:00">Sábado, 28/11/2026 · 20h</time>
        <span>Edifício Dhahram · Belém/PA</span>
      </p>

    </footer>
  </main>

  <div class="invitation-music" role="group" aria-label="Trilha sonora do convite">
    <audio id="invitationAudio" preload="none" loop src="../assets/audio/horizon-diamond-tunes.mp3?v=b3299040c0dd8eca81babe0c3fb5400e720fd88eda24c4000eb8f1b8d1a3da2f"></audio>
    <button id="musicToggle" class="music-toggle hidden" type="button" aria-controls="invitationAudio">

        <path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"></path>
        <path id="musicOnIcon" class="hidden" d="M15 9a4 4 0 0 1 0 6M17.5 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path>
        <path id="musicOffIcon" d="M16 9l5 6m0-6l-5 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path>
      </svg>
      <span id="musicLabel" class="music-label">Reproduzir música</span>
    </button>
    <p id="musicStatus" class="music-status" role="status" aria-live="polite"></p>
  </div>

  <script src="../invitation-audio.js?v=17"></script>
